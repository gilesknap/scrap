{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "scrap.backupName" . }}
  labels:
    {{- include "scrap.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Finished Jobs, and one-off ones made with
      # `kubectl create job --from=cronjob/...`,
      # are deleted after 7 days.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 1
      # A run waiting for the scrap pod's node (below) gives up after an hour.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "scrap.backupLabel" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          {{- include "scrap.podCommon" . | nindent 10 }}
          restartPolicy: Never
          # The data claim is ReadWriteOnce, and SQLite's online backup needs
          # the same host as the server: run beside the scrap pod.
          affinity:
            {{- include "scrap.sameNodeAffinity" . | nindent 12 }}
          containers:
            - name: backup
              image: {{ include "scrap.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # scrap-backup (deploy/scrap-backup, in the image) prunes with the
              # same rules as the single-server deploy: KEEP >= 1, only real
              # directories named like a run, NUL-safe.
              command:
                - /bin/sh
                - -ec
                - |
                  # Never at the same time as the gc CronJob: a file it deletes
                  # mid-backup could be one the backup's database still names.
                  exec 9>"$SCRAP_BACKUPS/.lock"
                  flock 9
                  dest="$SCRAP_BACKUPS/$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir "$dest"  # fails, touching nothing, if that run exists
                  if ! scrap backup "$dest"; then
                      rm -rf -- "$dest"
                      echo "Backup failed; kept the existing backups untouched." >&2
                      exit 1
                  fi
                  scrap-backup prune
                  echo "backed up to $dest"
              env:
                - name: SCRAP_DATA_DIR
                  value: /data
                - name: SCRAP_BACKUPS
                  value: /backups
                - name: SCRAP_BACKUP_KEEP
                  value: {{ .Values.backup.keep | quote }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "scrap.dataClaim" . }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "scrap.backupClaim" . }}
            - name: tmp
              emptyDir: {}
{{- end }}
