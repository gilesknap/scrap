# Values for the scrap chart. See docs/how-to/deploy-kubernetes.md.
#
# scrap keeps everything in one SQLite database with a single writer, so the chart
# always runs exactly ONE replica with the Recreate strategy (the old pod stops
# before the new one starts). There is no replicas value on purpose.
#
# v0 of scrap has NO login: anyone who can reach the Service can read and change
# everything. Expose it only on a private network (e.g. the Tailscale operator) or
# behind an authenticating proxy, never directly to the internet.

image:
  repository: ghcr.io/gilesknap/scrap
  # Defaults to the chart's appVersion. Multi-arch (amd64 + arm64) from releases.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Largest request body in MB (a capture's files together): SCRAP_MAX_UPLOAD_MB.
# Raise any ingress controller's body limit to match.
maxUploadMB: 50

# Ingest sends queued photos to the Claude API. Photos are queued either way.
ingest:
  enabled: false
  # Name of an existing Secret in the release namespace. Required when enabled.
  # The chart never takes the key itself as a value and never creates a Secret.
  existingSecret: ""
  # Key in that Secret holding the Claude API key (becomes ANTHROPIC_API_KEY).
  apiKeyKey: ANTHROPIC_API_KEY
  # Optional key in the same Secret holding SCRAP_NOTIFY_URL (e.g. an ntfy topic
  # URL, which is itself a secret): ingest pauses, and the gc job starting a month's
  # Orphaned assets page. Empty: no notifications.
  notifyUrlKey: ""
  # SCRAP_VISION_MODEL; empty uses the app's default.
  visionModel: ""
  # SCRAP_BUDGET_DAY_USD in dollars, e.g. 3 or "2.5"; empty uses the app's default.
  budgetDayUSD: ""

# SCRAP_IDENTITY_HEADER: the request header recorded as the author of a change.
# Empty uses the app's default, Tailscale-User-Login. Behind an authenticating
# proxy set the header it adds, e.g. X-Auth-Request-User. Only this header is read.
identityHeader: ""

mcp:
  # Bearer token(s) /mcp requires (SCRAP_MCP_TOKEN). Name an existing Secret in the
  # release namespace and the key holding the token, or several comma separated.
  # The chart never takes a token as a value and never creates the Secret. Empty
  # name: /mcp needs no token. The PWA, the API and /healthz are never affected.
  tokenSecret:
    name: ""
    key: SCRAP_MCP_TOKEN

# Extra environment for the scrap container (list of EnvVar / EnvFromSource).
extraEnv: []
extraEnvFrom: []

# The data volume at /data: database, files and the preview cache. The preview
# cache (cache/previews) is regenerable and never backed up; it stays here so a
# restart does not redo every preview.
persistence:
  # Use this PVC instead of creating one.
  existingClaim: ""
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  annotations:
    # helm uninstall (and deleting an Argo CD Application) leaves the claim
    # and your data in place.
    helm.sh/resource-policy: keep
    # Argo CD never prunes the claim, e.g. after a switch to existingClaim.
    argocd.argoproj.io/sync-options: Prune=false

# A CronJob running `scrap backup` into a timestamped directory on a second PVC,
# then keeping only the newest `keep` runs (the same pruning as the single-server
# deploy). Each run is a full copy: size the claim for about keep + 1 times the
# data. It is a local copy only: copy it off the cluster too.
backup:
  enabled: true
  schedule: "30 3 * * *"
  # IANA time zone for the schedule, e.g. Europe/London; empty uses the
  # controller's (usually UTC).
  timeZone: ""
  keep: 7
  # A second, longer-lived tier: a full copy on the 1st of each month in the claim's
  # monthly/ folder, keeping the newest `keep`. The daily runs only reach back `keep`
  # days, so a destructive change noticed later can still be undone from here. The
  # claim then holds about backup.keep + monthly.keep + 1 copies.
  monthly:
    enabled: true
    schedule: "50 3 1 * *"
    timeZone: ""
    keep: 12
  persistence:
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# A CronJob running `scrap gc`: it deletes the stored files nothing uses, the
# model/enrich run records past retention, the pages in the trash past trashDays and the
# finished job records past jobDays, and gathers the files of captures no page
# shows any more onto the month's "Orphaned assets" todo page for review (never
# deleting them), as the single-server deploy does nightly.
# Like deploy/scrap-gc it deletes only when the backup claim holds a completed backup run
# (with its COMPLETE marker) less than 26 hours old; otherwise it only counts and the Job fails, so a missing backup
# shows. It runs an hour after the backup (and takes the backup's lock, so never
# during one), so it needs backup.enabled. It runs beside the scrap pod (the data
# claim is ReadWriteOnce).
gc:
  # null: follow backup.enabled (so a release with backups off renders as before).
  # true with backup.enabled false and requireBackup true is refused; false: off.
  enabled: null
  schedule: "30 4 * * *"
  timeZone: ""
  # The switch for deleting. Off, or with graceHours 0 (no grace period), the Job only
  # counts what it would delete and gather (a dry run: see its log) and succeeds.
  # Deletion is permanent: gc removes unreferenced files (a capture's only once its page
  # is purged from the trash: until then it gathers them), past runDays the stored
  # prompts and raw responses of Claude calls, and past trashDays the trash.
  delete: true
  # Keep files younger than this, used or not: an upload may be on its way.
  graceHours: 24
  # Keep model_run / enrich_run records younger than this many days (at least 1);
  # older ones go unless something refers to them or they are a page's latest.
  runDays: 30
  # Purge the pages in the trash longer than this many days (at least 1), with their
  # captures, history and Claude's results; their files then go as unused ones do. A
  # topic page in the trash is never purged (its key stops Claude making it again).
  # The scrap pod shows each trashed page's purge date from it (SCRAP_TRASH_DAYS:
  # "off" while this job does not delete).
  trashDays: 30
  # Delete finished (done or dead) ingest and enrich job records last changed more
  # than this many days ago (at least 1), but the latest of each photo and page.
  jobDays: 30
  # false: delete without checking for a recent backup (for backups kept outside
  # the chart; then backup.enabled may be false).
  requireBackup: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# A CronJob running `scrap enrich --related` (the single server's
# scrap-enrich-related timer): picks related pages for every page changed since its
# last picks. It calls Claude, so it is created only when ingest.enabled is on; it gets
# the same key and settings as the scrap pod and shares its daily budget. It runs
# beside the scrap pod (the data claim is ReadWriteOnce).
enrichRelated:
  enabled: true
  schedule: "41 3 * * *"
  timeZone: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# A CronJob running `scrap enrich --topics` (the single server's
# scrap-enrich-topics timer), weekly: one Claude call finds topics (new topic pages and
# their sources), then each topic's synthesis that is due is queued for the scrap
# pod's worker. Created only when ingest.enabled is on; same key, settings and daily
# budget as the scrap pod; runs beside it (the data claim is ReadWriteOnce).
enrichTopics:
  enabled: true
  schedule: "11 4 * * 0"
  timeZone: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

service:
  type: ClusterIP
  port: 80
  # e.g. tailscale.com/expose: "true" (plain HTTP on the tailnet; prefer ingress).
  annotations: {}

ingress:
  enabled: false
  # e.g. tailscale (Tailscale operator) or nginx/traefik behind an auth proxy.
  className: ""
  annotations: {}
  # Host names for the rules; empty gives one rule without a host.
  hosts: []
  # Standard Ingress tls list. For the Tailscale operator the first host here is
  # the MagicDNS name: [{hosts: [scrap]}].
  tls: []

# Default off. When on, only the peers in `from` may connect to scrap (an empty
# list admits nobody). Egress is not restricted.
networkPolicy:
  enabled: false
  from: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: tailscale

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

# Restricted Pod Security Standard. The image runs as uid/gid 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The 1Gi memory limit matches the preview decoder's budget, which is sized for a
# 1 GB container. Lowering it can get scrap OOM-killed on large photos.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# A clean stop gives the ingest job in flight back to the queue; 30s is plenty.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
