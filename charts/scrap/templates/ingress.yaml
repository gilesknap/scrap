{{- include "scrap.authProxyChecks" . }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "scrap.fullname" . }}
  labels:
    {{- include "scrap.labels" . | nindent 4 }}
  {{- with include "scrap.ingressAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range (.Values.ingress.hosts | default (list "")) }}
    - {{- with . }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "scrap.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
