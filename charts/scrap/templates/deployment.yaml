{{- if and .Values.ingest.enabled (not .Values.ingest.existingSecret) }}
{{- fail "ingest.enabled needs ingest.existingSecret: the name of a Secret holding the API key" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scrap.fullname" . }}
  labels:
    {{- include "scrap.labels" . | nindent 4 }}
spec:
  # SQLite has a single writer: exactly one pod, and the old one stops first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "scrap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scrap.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "scrap.podCommon" . | nindent 6 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: scrap
          image: {{ include "scrap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "scrap.appEnv" . | nindent 12 }}
            {{- if .Values.public.enabled }}
            # Public pages: the receiver scrap pushes them to, the site's address,
            # and the upload token (from the same-named Secret in this namespace)
            - name: SCRAP_PUBLISH_TO
              value: {{ include "scrap.publishTo" . | quote }}
            - name: SCRAP_PUBLISH_SITE
              value: {{ .Values.public.site | trimSuffix "/" | quote }}
            - name: SCRAP_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.public.tokenSecret.name }}
                  key: {{ .Values.public.tokenSecret.key }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Migrations run before the server listens: the startup probe allows
          # them up to 5 minutes. /healthz answers 503 if the ingest worker
          # thread has died, and the liveness probe then restarts the pod.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "scrap.dataClaim" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
