name: Chart

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  check:
    name: check (helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Helm 3 for Argo CD and older installs, Helm 4 for current ones
        include:
          - helm: v3.22.1
            sha256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
          - helm: v4.3.1
            sha256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
    env:
      HELM_VERSION: ${{ matrix.helm }}
      HELM_SHA256: ${{ matrix.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum -c
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          curl -fsSLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kc.tgz" | sha256sum -c
          tar -xzf kc.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint, render and validate
        run: ./charts/test-chart.sh

  publish:
    name: publish chart
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tag is the app version and names the image (0.2.0, 0.2.0rc1). Helm
      # needs semver for the chart version, so 0.2.0rc1 becomes 0.2.0-rc.1.
      - name: Work out the chart version from the tag
        run: |
          if [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)((a|b|rc)([0-9]+))?$ ]]; then
              version="${BASH_REMATCH[1]}"
              [ -z "${BASH_REMATCH[2]}" ] || version="$version-${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
              echo "CHART_VERSION=$version" >> "$GITHUB_ENV"
          else
              echo "Invalid tag '$TAG': expected X.Y.Z, or X.Y.ZaN, X.Y.ZbN, X.Y.ZrcN" >&2
              exit 1
          fi

      - name: Package the chart
        run: helm package charts/scrap --version "$CHART_VERSION" --app-version "$TAG"

      - name: Push the chart to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$OWNER" --password-stdin
          helm push "scrap-$CHART_VERSION.tgz" "oci://ghcr.io/$owner/charts"
