<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161411" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-init.js"></script>
    <!-- Everything comes from scrap (Excalidraw would fall back to its CDN); scripts only from
         files, never inline. Styles keep 'unsafe-inline': Mermaid and Excalidraw write style
         attributes and elements. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>scrap</title>
  </head>
  <body>
    <header>
      <a href="/" class="logo"
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h14v15l-2.3-1.5-2.4 1.5-2.3-1.5-2.3 1.5-2.4-1.5L5 18.5z" /></svg
        >scrap<small id="ver" aria-hidden="true"></small></a
      >
      <button type="button" id="back" class="ghost" hidden
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg
        ><span id="backto"></span
      ></button>
      <span id="pos"></span>
      <button type="button" id="queue" class="badge" hidden></button>
      <button type="button" id="new" class="ghost" aria-label="New todo" hidden
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg
      ></button>
      <button type="button" id="settings" class="ghost" aria-label="Settings"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 9.9L21.4 10.4L21.4 13.6L18.9 14.1L18.4 15.4L19.8 17.5L17.5 19.8L15.4 18.4L14.1 18.9L13.6 21.4L10.4 21.4L9.9 18.9L8.6 18.4L6.5 19.8L4.2 17.5L5.6 15.4L5.1 14.1L2.6 13.6L2.6 10.4L5.1 9.9L5.6 8.6L4.2 6.5L6.5 4.2L8.6 5.6L9.9 5.1L10.4 2.6L13.6 2.6L14.1 5.1L15.4 5.6L17.5 4.2L19.8 6.5L18.4 8.6Z"/><circle cx="12" cy="12" r="3"/></svg
      ></button>
    </header>
    <main id="view"></main>
    <nav>
      <a href="/"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg
        >Capture</a
      >
      <a href="/todos"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="m8.5 12 2.5 2.5 4.5-5" /></svg
        ><b class="due-n" aria-hidden="true" hidden></b>Todos</a
      >
      <a href="/search"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg
        >Search</a
      >
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
