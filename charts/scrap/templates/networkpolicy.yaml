{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scrap.fullname" . }}
  labels:
    {{- include "scrap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "scrap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- $metricsFrom := list }}
  {{- if and .Values.litestream.enabled .Values.litestream.jobs.metrics.enabled }}
  {{- $metricsFrom = .Values.litestream.jobs.metrics.from }}
  {{- end }}
  {{- if or .Values.networkPolicy.from $metricsFrom }}
  ingress:
    {{- with .Values.networkPolicy.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
    {{- end }}
    {{- with $metricsFrom }}
    # scrap schedule's metrics (litestream.jobs.metrics.from)
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
