<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161411" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-init.js"></script>
    <!-- Everything comes from scrap (Excalidraw would fall back to its CDN); scripts only from
         files, never inline. Styles keep 'unsafe-inline': Mermaid and Excalidraw write style
         attributes and elements. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>scrap</title>
  </head>
  <body>
    <header>
      <a href="/" class="logo"
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h14v15l-2.3-1.5-2.4 1.5-2.3-1.5-2.3 1.5-2.4-1.5L5 18.5z" /></svg
        >scrap</a
      >
      <button type="button" id="back" class="ghost" aria-label="Back" hidden
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg
      ></button>
      <!-- biome-ignore lint/a11y/useHeadingContent: the screen's name, set by main.ts when shown -->
      <h1 id="where" hidden></h1>
      <button type="button" id="queue" class="badge" hidden></button>
      <button type="button" id="new" class="ghost" aria-label="New todo" hidden
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg
      ></button>
      <button type="button" id="settings" class="ghost" aria-label="Settings"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.5"/><path d="M18.5 12.0L21.0 12.0M16.6 16.6L18.4 18.4M12.0 18.5L12.0 21.0M7.4 16.6L5.6 18.4M5.5 12.0L3.0 12.0M7.4 7.4L5.6 5.6M12.0 5.5L12.0 3.0M16.6 7.4L18.4 5.6"/></svg
      ></button>
    </header>
    <main id="view"></main>
    <nav>
      <a href="/"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg
        >Capture</a
      >
      <a href="/todos"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="m8.5 12 2.5 2.5 4.5-5" /></svg
        ><b class="due-n" aria-hidden="true" hidden></b>Todos</a
      >
      <a href="/search"
        ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg
        >Search</a
      >
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
