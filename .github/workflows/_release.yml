on:
  workflow_call:

jobs:
  artifacts:
    runs-on: ubuntu-latest

    steps:
      # Only the files to attach to the release: CI's other artifacts (image
      # digests, test traces) are not release assets
      - name: Download the sdist and wheel
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Download the docs
        uses: actions/download-artifact@v8
        with:
          name: docs

      - name: Zip up docs
        run: |
          set -vxeuo pipefail
          if [ -d html ]; then
            mv html $GITHUB_REF_NAME
            zip -r docs.zip $GITHUB_REF_NAME
            rm -rf $GITHUB_REF_NAME
          fi

      # The slash-command installer, pinned to this tag: the README's one-liner fetches
      # releases/latest/download/install.sh, so it follows releases, not main
      - name: Check out the installer
        uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: commands/install.sh
          sparse-checkout-cone-mode: false

      - name: Attach the installer, pinned to this tag
        run: |
          set -euo pipefail
          sed "s/^default_ref=main\$/default_ref=$GITHUB_REF_NAME/" repo/commands/install.sh > install.sh
          grep -qx "default_ref=$GITHUB_REF_NAME" install.sh
          rm -rf repo

      - name: Create GitHub Release
        # We pin to the SHA, not the tag, for security reasons.
        # https://docs.github.com/en/actions/learn-github-actions/security-hardening-for-github-actions#using-third-party-actions
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: "*"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
