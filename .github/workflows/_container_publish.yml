on:
  workflow_call:

jobs:
  # Tags the per-platform images _container.yml pushed by digest as one multi-arch
  # image. The caller runs this only once the tests have passed, so a tag a user
  # (or the cluster) pulls never points at an untested build.
  manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tags for publishing image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}

      - name: Push the multi-arch image under its tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          while read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          # Check the index lists both platforms before any tag points at it
          platforms=$(docker buildx imagetools create --dry-run "${args[@]}" \
            | jq -r '.manifests[].platform | .os + "/" + .architecture' | sort -u)
          echo "$platforms"
          grep -qx linux/amd64 <<< "$platforms"
          grep -qx linux/arm64 <<< "$platforms"
          docker buildx imagetools create "${args[@]}"
