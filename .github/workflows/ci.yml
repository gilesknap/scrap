name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:

  lint:
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking

  test:
    strategy:
      matrix:
        runs-on: ["ubuntu-latest"] # can add windows-latest, macos-latest
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck deploy scripts
        run: shellcheck deploy/*.sh deploy/check-env deploy/scrap-run deploy/scrap-backup deploy/scrap-gc
      - name: Run deploy shell tests
        run: |
          for t in deploy/test-*.sh; do
            echo "== $t"
            sh "$t"
          done

  web:
    uses: ./.github/workflows/_web.yml

  # The image builds alongside the tests; on a tag, each platform's image is
  # pushed by digest only, with no tag anything could deploy
  container:
    uses: ./.github/workflows/_container.yml
    with:
      push-digests: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write

  # On a tag, publish the image as <tag> and latest once the checks have passed.
  # This and the Chart workflow are all a deploy needs: docs and the GitHub
  # Release can finish later
  container-publish:
    needs: [container, lint, test, deploy, web]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_container_publish.yml
    permissions:
      contents: read
      packages: write

  docs:
    uses: ./.github/workflows/_docs.yml
    permissions:
      contents: write

  dist:
    uses: ./.github/workflows/_dist.yml

  release:
    needs: [dist, test, deploy, docs, web]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
