on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: The version of python to install, default is from .python-version file
        default: ""
      runs-on:
        type: string
        description: The runner to run this job on
        required: true

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      # Coverage tracing makes the timing-heavy tests ~4x slower on the 3.11/3.12 tracer,
      # and one interpreter's report is enough: trace on 3.14 only
      - name: Run tests
        run: uv run --locked tox -e tests ${{ inputs.python-version != '3.14' && '-- --no-cov' || '' }}

      - name: Upload coverage to Codecov
        if: inputs.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          name: ${{ inputs.python-version }}/${{ inputs.runs-on }}
          files: cov.xml
