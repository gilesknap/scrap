# Values for the scrap chart. See docs/how-to/deploy-kubernetes.md.
#
# scrap keeps everything in one SQLite database with a single writer, so the chart
# always runs exactly ONE replica with the Recreate strategy (the old pod stops
# before the new one starts). There is no replicas value on purpose.
#
# scrap has NO login of its own: anyone who can reach the Service can read and change
# everything. Expose it only on a private network (e.g. the Tailscale operator) or
# behind an authenticating proxy, never directly to the internet.

image:
  repository: ghcr.io/gilesknap/scrap
  # Defaults to the chart's appVersion. Multi-arch (amd64 + arm64) from releases.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Largest request body in MB (a capture's files together): SCRAP_MAX_UPLOAD_MB.
# Raise any ingress controller's body limit to match.
maxUploadMB: 50

# Ingest sends queued photos to the Claude API. Photos are queued either way.
ingest:
  enabled: false
  # Name of an existing Secret in the release namespace. Required when enabled.
  # The chart never takes the key itself as a value and never creates a Secret.
  existingSecret: ""
  # Key in that Secret holding the Claude API key (becomes ANTHROPIC_API_KEY).
  apiKeyKey: ANTHROPIC_API_KEY
  # Optional key in the same Secret holding SCRAP_NOTIFY_URL (e.g. an ntfy topic
  # URL, which is itself a secret): ingest pauses, and the gc job starting a month's
  # Orphaned assets page. Empty: no notifications.
  notifyUrlKey: ""
  # SCRAP_VISION_MODEL; empty uses the app's default.
  visionModel: ""
  # SCRAP_BUDGET_DAY_USD in dollars, e.g. 3 or "2.5"; empty uses the app's default.
  budgetDayUSD: ""

# SCRAP_IDENTITY_HEADER: the request header recorded as the author of a change.
# Empty uses the app's default, Tailscale-User-Login. Behind your own authenticating
# proxy set the header it adds, e.g. X-Auth-Request-User. Only this header is read.
# With authProxy.enabled it is not read at all: the author is the verified email in
# the proxy's token (ADR 45).
identityHeader: ""

mcp:
  # Bearer token(s) /mcp requires (SCRAP_MCP_TOKEN). Name an existing Secret in the
  # release namespace and the key holding the token, or several comma separated.
  # The chart never takes a token as a value and never creates the Secret. Empty
  # name: /mcp needs no token. The PWA, the API and /healthz are never affected.
  tokenSecret:
    name: ""
    key: SCRAP_MCP_TOKEN

# Extra environment for the scrap container (list of EnvVar / EnvFromSource).
extraEnv: []
extraEnvFrom: []

# The data volume at /data: database, files and the preview cache. The preview
# cache (cache/previews) is regenerable and never backed up; it stays here so a
# restart does not redo every preview.
persistence:
  # Use this PVC instead of creating one.
  existingClaim: ""
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  annotations:
    # helm uninstall (and deleting an Argo CD Application) leaves the claim
    # and your data in place.
    helm.sh/resource-policy: keep
    # Argo CD never prunes the claim, e.g. after a switch to existingClaim.
    argocd.argoproj.io/sync-options: Prune=false

# A CronJob running `scrap backup` into a timestamped directory on a second PVC,
# then keeping only the newest `keep` runs (the same pruning as the single-server
# deploy). Each run is a full copy: size the claim for about keep + 1 times the
# data. It is a local copy only: copy it off the cluster too.
backup:
  enabled: true
  schedule: "30 3 * * *"
  # IANA time zone for the schedule, e.g. Europe/London; empty uses the
  # controller's (usually UTC).
  timeZone: ""
  keep: 7
  # A second, longer-lived tier: a full copy on the 1st of each month in the claim's
  # monthly/ folder, keeping the newest `keep`. The daily runs only reach back `keep`
  # days, so a destructive change noticed later can still be undone from here. The
  # claim then holds about backup.keep + monthly.keep + 1 copies.
  monthly:
    enabled: true
    schedule: "50 3 1 * *"
    timeZone: ""
    keep: 12
  persistence:
    # A directory on every node (an absolute path, e.g. a shared filesystem mounted
    # on all of them) to keep the backups in, instead of a claim: no claim is made
    # and the settings below are unused. It must exist, and the pods'
    # podSecurityContext user must be able to write it. A namespace that enforces
    # the baseline or restricted Pod Security Standard rejects hostPath volumes,
    # so there the backup jobs never start: use the claim.
    hostPath: ""
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# A CronJob running `scrap gc`: it deletes the stored files nothing uses, the
# model/enrich run records past retention, the pages in the trash past trashDays and the
# finished job records past jobDays, and gathers the files of captures no page
# shows any more onto the month's "Orphaned assets" todo page for review (never
# deleting them), as the single-server deploy does nightly.
# Like deploy/scrap-gc it deletes only when the backup claim holds a completed backup run
# (with its COMPLETE marker) less than 26 hours old; otherwise it only counts and the Job fails, so a missing backup
# shows. It runs an hour after the backup (and takes the backup's lock, so never
# during one), so it needs backup.enabled. It runs beside the scrap pod (the data
# claim is ReadWriteOnce).
gc:
  # null: follow backup.enabled (so a release with backups off renders as before).
  # true with backup.enabled false and requireBackup true is refused; false: off.
  enabled: null
  schedule: "30 4 * * *"
  timeZone: ""
  # The switch for deleting. Off, or with graceHours 0 (no grace period), the Job only
  # counts what it would delete and gather (a dry run: see its log) and succeeds.
  # Deletion is permanent: gc removes unreferenced files (a capture's only once its page
  # is purged from the trash: until then it gathers them), past runDays the stored
  # prompts and raw responses of Claude calls, and past trashDays the trash.
  delete: true
  # Keep files younger than this, used or not: an upload may be on its way.
  graceHours: 24
  # Keep model_run / enrich_run records younger than this many days (at least 1);
  # older ones go unless something refers to them or they are a page's latest.
  runDays: 30
  # Purge the pages in the trash longer than this many days (at least 1), with their
  # captures, history and Claude's results; their files then go as unused ones do. A
  # topic page in the trash is never purged (its key stops Claude making it again).
  # The scrap pod shows each trashed page's purge date from it (SCRAP_TRASH_DAYS:
  # "off" while this job does not delete).
  trashDays: 30
  # Delete finished (done or dead) ingest and enrich job records last changed more
  # than this many days ago (at least 1), but the latest of each photo and page.
  jobDays: 30
  # false: delete without checking for a recent backup (for backups kept outside
  # the chart; then backup.enabled may be false).
  requireBackup: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# A CronJob running `scrap enrich --related` (the single server's
# scrap-enrich-related timer): picks related pages for every page changed since its
# last picks. It calls Claude, so it is created only when ingest.enabled is on; it gets
# the same key and settings as the scrap pod and shares its daily budget. It runs
# beside the scrap pod (the data claim is ReadWriteOnce).
enrichRelated:
  enabled: true
  schedule: "41 3 * * *"
  timeZone: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# A CronJob running `scrap enrich --topics` (the single server's
# scrap-enrich-topics timer), weekly: one Claude call finds topics (new topic pages and
# their sources), then each topic's synthesis that is due is queued for the scrap
# pod's worker. Created only when ingest.enabled is on; same key, settings and daily
# budget as the scrap pod; runs beside it (the data claim is ReadWriteOnce).
enrichTopics:
  enabled: true
  schedule: "11 4 * * 0"
  timeZone: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# The database on an emptyDir (the node's disk), replicated continuously by Litestream to
# /data/litestream on the data volume, for a data volume on NFS or another network
# filesystem, where SQLite's WAL is not safe (ADR 46, docs/how-to/deploy-kubernetes.md).
# files/ stays on the data volume. Off: the database stays at /data/scrap.db.
# On: the last moments of writes (about a second) are lost if the node dies. An init
# container restores the database, brings an existing /data/scrap.db across once, or
# refuses to start; backups work from a restore of the replica; and gc and the Claude
# passes run in a "jobs" container in the scrap pod, not as CronJobs. Needs Kubernetes 1.29.
litestream:
  enabled: false
  image:
    repository: litestream/litestream
    # An exact version, chosen in ADR 46. Moving it is a decision: read the release notes.
    tag: "0.5.18"
    digest: sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
    pullPolicy: IfNotPresent
  # The emptyDir's limit. Past it the kubelet evicts the pod, so leave room for the WAL.
  sizeLimit: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  init:
    # true starts scrap although the replica is missing or the install has history, or
    # lets the replica win over a changed /data/scrap.db (db-init's log says which). For
    # after a person has looked. Set it back to false afterwards.
    override: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
  # The jobs container: gc and, with ingest on, the Claude passes, with their usual
  # schedules (gc.schedule and so on), and the heartbeat the backup jobs check.
  jobs:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

service:
  type: ClusterIP
  port: 80
  # e.g. tailscale.com/expose: "true" (plain HTTP on the tailnet; prefer ingress).
  annotations: {}

ingress:
  enabled: false
  # e.g. tailscale (Tailscale operator) or nginx/traefik behind an auth proxy.
  className: ""
  annotations: {}
  # Host names for the rules; empty gives one rule without a host.
  hosts: []
  # Standard Ingress tls list. For the Tailscale operator the first host here is
  # the MagicDNS name: [{hosts: [scrap]}].
  tls: []

# A login for the web app through an oauth2-proxy you run (ingress-nginx only).
# Needs ingress.enabled, ingress.tls (the login's cookie is https only) and
# mcp.tokenSecret. The Ingress gets ingress-nginx's auth-url, auth-signin and
# auth-response-headers annotations, so each request needs a login at the proxy, and
# scrap itself lets in only allowedEmails (oidc, below). A second Ingress (<fullname>-open, same class, hosts and
# tls) has no auth: /mcp goes to scrap (guard it with mcp.tokenSecret) and /oauth2
# to the proxy, through an ExternalName Service (<fullname>-oauth2), so the sign-in
# and its cookie are on scrap's own host. identityHeader defaults to
# X-Auth-Request-Email. Both Ingresses get proxy-buffer-size 16k unless
# ingress.annotations sets it (the login's cookies overflow the 4k default). The proxy needs reverse_proxy and set_xauthrequest on, and no
# fixed redirect_url. Default off.
authProxy:
  enabled: false
  # oauth2-proxy's in-cluster DNS name, e.g. oauth2-proxy.scrap.svc.cluster.local
  service: ""
  port: 80
  # The logins (email addresses) that may use the web app: scrap checks them in the
  # proxy's token (anyone else the proxy lets log in gets 401). Required when
  # enabled; lower-cased, as Keycloak's emails are.
  allowedEmails: []
  # scrap checks the Keycloak access token the proxy passes on (ADR 45), so a pod
  # that calls scrap's Service directly cannot get in. Both required when enabled.
  oidc:
    # The realm's issuer URL, exactly as in its tokens' iss.
    issuer: ""
    # The proxy's Keycloak client: a token must be issued to it (azp or aud).
    clientId: ""

# Default off. When on, only the peers in `from` may connect to scrap (an empty
# list admits nobody). Egress is not restricted.
networkPolicy:
  enabled: false
  from: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: tailscale

# Public pages (issue 497): a static site of the pages marked Public, served by
# nginx from the scrap-public image, in a namespace of its own. Its upload receiver
# is internal only: scrap pushes each public page to it with a bearer token. Only
# nginx is on the Ingress; a NetworkPolicy lets only scrap's pod reach the receiver,
# and nothing in the namespace may connect out. Off by default.
public:
  enabled: false
  # The namespace the public side runs in; it may be the release namespace (then
  # one Secret serves both sides, and createNamespace stays false). Create it first, labelled Pod Security
  # "restricted", with the token Secret in it (docs/how-to/deploy-kubernetes.md).
  namespace: scrap-public
  # true: the chart creates the namespace, with those labels. Then helm uninstall
  # (or an Argo CD prune) deletes the namespace and the Secret in it too.
  createNamespace: false
  image:
    repository: ghcr.io/gilesknap/scrap-public
    # Defaults to the chart's appVersion, as scrap's own image does.
    tag: ""
    pullPolicy: IfNotPresent
  # The site's public base URL, e.g. https://pages.example.org (SCRAP_PUBLISH_SITE,
  # which scrap's pages and links are made with). Required when enabled.
  site: ""
  # The upload token: name an existing Secret and the key holding it (at least 32
  # characters). The receiver runs in public.namespace and scrap in the release
  # namespace, and a pod reads only its own namespace's Secrets, so create the
  # Secret, with the same name and key, in BOTH. The receiver reads it as a
  # mounted file (RECEIVER_TOKEN_FILE), scrap too (SCRAP_PUBLISH_TOKEN_FILE). The chart
  # never creates it. Required when enabled.
  tokenSecret:
    name: ""
    key: token
  # false (the default): X-Robots-Tag noindex and a robots.txt disallowing all.
  indexing: false
  # The Ingress for nginx (never the receiver). Ingress objects live in
  # public.namespace, with the web Service.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    # Host names for the rules, e.g. [pages.example.org]; empty gives one rule
    # without a host.
    hosts: []
    tls: []
  networkPolicy:
    # false: no NetworkPolicy for the public side, e.g. where you may not create one.
    # The receiver is then open to any pod that can reach it (it still needs the token).
    enabled: true
    # Who may reach nginx (NetworkPolicy peers, e.g. your ingress controller's
    # namespace). Empty: anyone, since nginx serves only public files. The
    # receiver is always open to scrap's pods alone, and egress is always denied.
    webFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  # The site volume, an emptyDir shared by nginx (read only) and the receiver. The
  # receiver's quota is 2 GiB; leave room for one upload in staging (256 MiB). An
  # emptyDir starts empty when the pod moves. Refilling it (scrap checking the
  # receiver's manifest and pushing the site back) arrives with the scrap side of
  # issue 497, which builds scrap's publisher.
  sizeLimit: 3Gi
  resources:
    web:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    receiver:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

# Restricted Pod Security Standard. The image runs as uid/gid 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The 1Gi memory limit matches the preview decoder's budget, which is sized for a
# 1 GB container. Lowering it can get scrap OOM-killed on large photos.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# A clean stop gives the ingest job in flight back to the queue; 30s is plenty.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
