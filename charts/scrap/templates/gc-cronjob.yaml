{{- if include "scrap.gcEnabled" . }}
{{- if and .Values.gc.requireBackup (not .Values.backup.enabled) }}
{{- fail "gc.enabled=true needs backup.enabled (gc deletes only after a recent backup); leave gc.enabled unset or false, or gc.requireBackup=false to delete without one" }}
{{- end }}
{{- /* With Litestream the job runs in the scrap pod instead: scrap.scheduledJobs. */ -}}
{{- if not .Values.litestream.enabled }}
{{- $suffix := "-gc" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "scrap.cronName" (dict "ctx" . "suffix" $suffix) }}
  labels:
    {{- include "scrap.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.gc.schedule | quote }}
  {{- with .Values.gc.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  # A deleting scrap gc refuses to run beside another (gc.lock in the data folder), but
  # never start one while another runs anyway.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Finished Jobs, and one-off ones made with
      # `kubectl create job --from=cronjob/...`,
      # are deleted after 7 days.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 0
      # A run waiting for the scrap pod's node (below), or for a backup, gives up
      # after an hour.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "scrap.cronLabel" (dict "ctx" . "suffix" $suffix) }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          {{- include "scrap.podCommon" . | nindent 10 }}
          restartPolicy: Never
          # The data claim is ReadWriteOnce, and SQLite needs the server's host:
          # run beside the scrap pod.
          affinity:
            {{- include "scrap.sameNodeAffinity" . | nindent 12 }}
          containers:
            - name: gc
              image: {{ include "scrap.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Same rules as deploy/scrap-gc on the single server: delete only when
              # a completed backup run (with its COMPLETE marker) less than 26 hours old exists; otherwise count only
              # and fail, so a missing backup shows as a failed Job.
              command:
                - /bin/sh
                - -ec
                - |
                  {{- include "scrap.gcScript" . | trim | nindent 18 }}
              env:
                - name: SCRAP_DATA_DIR
                  value: /data
                - name: SCRAP_BACKUPS
                  value: /backups
                {{- if .Values.ingest.enabled }}
                {{- with .Values.ingest.notifyUrlKey }}
                # A push when gc starts a month's Orphaned assets page.
                - name: SCRAP_NOTIFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.ingest.existingSecret }}
                      key: {{ . }}
                {{- end }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.gc.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                {{- if .Values.backup.enabled }}
                # Read-write only for the lock file.
                - name: backups
                  mountPath: /backups
                {{- end }}
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "scrap.dataClaim" . }}
            {{- if .Values.backup.enabled }}
            - name: backups
              {{- include "scrap.backupVolume" . | nindent 14 }}
            {{- end }}
            - name: tmp
              emptyDir: {}
{{- end }}
{{- end }}
