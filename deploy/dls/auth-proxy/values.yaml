# Values for the upstream oauth2-proxy chart (https://oauth2-proxy.github.io/manifests),
# the one central login proxy for every DLS user's scrap. install.sh deploys it as
# release "oauth2-proxy", so its Service is oauth2-proxy.<namespace>.svc.cluster.local:80.
#
# It never proxies scrap itself. ingress-nginx asks it on each request
# (nginx.ingress.kubernetes.io/auth-url .../oauth2/auth, with no query: DLS's ingress
# refuses an @ or % there), and each
# user's /oauth2/* reaches it through an ExternalName Service in that user's namespace,
# so the login cookie belongs to that user's own host, never to .diamond.ac.uk.

replicaCount: 2
podDisruptionBudget:
  enabled: true
revisionHistoryLimit: 2
# It never calls the Kubernetes API.
serviceAccount:
  automountServiceAccountToken: false
enableServiceLinks: false

config:
  # Keys client-id, client-secret and cookie-secret, made by install.sh. Nothing secret
  # is in this file.
  existingSecret: oauth2-proxy-keycloak
  configFile: |-
    provider = "keycloak-oidc"
    oidc_issuer_url = "https://identity.diamond.ac.uk/realms/dls"
    # The profile scope puts preferred_username (the fedid) in the access token, which
    # scrap checks; email is for the proxy's own email_domains check. No
    # offline_access: a login lasts as long as the DLS Keycloak session.
    scope = "openid email profile"
    code_challenge_method = "S256"

    # Any DLS login passes the proxy; each user's scrap then admits only its owner by
    # fedid, checking the access token passed on (ADR 45). Anyone else gets scrap's 401.
    email_domains = ["diamond.ac.uk"]
    # DLS Keycloak does not verify emails (email_verified is false for staff), and the
    # proxy would refuse every login with a 500. The email is not the gate: the proxy
    # admits any DLS login and each scrap admits only its owner by fedid.
    insecure_oidc_allow_unverified_email = true

    # Answer nginx's auth subrequests only: no upstream.
    upstreams = ["static://202"]
    reverse_proxy = true
    set_xauthrequest = true
    # And X-Auth-Request-Access-Token: the user's Keycloak access token, which each
    # scrap checks itself (ADR 45), since any pod can reach scrap's Service directly.
    pass_access_token = true
    skip_provider_button = true

    # No redirect_url and no cookie_domains: the callback and the cookie are on the
    # host the request came to (scrap-<fedid>.diamond.ac.uk).
    cookie_name = "_scrap_auth"
    cookie_secure = true
    cookie_samesite = "lax"
    # A week at most; in practice the Keycloak session ends it first, when the refresh
    # below fails and the user logs in again.
    cookie_expire = "168h"
    # Keycloak's access tokens last 5 minutes and scrap refuses an expired one, so the
    # session is refreshed (with its refresh token) well inside that. The session is in
    # Redis (sessionStorage below), so a refresh rewrites it there and the cookie is only
    # a small ticket that does not change: concurrent requests cannot carry a mix of old
    # and new cookie chunks, as they did when the whole session (over 4 KB with DLS
    # Keycloak's tokens) was split across cookies.
    cookie_refresh = "1m"

ingress:
  # Reached only in the cluster: from nginx's auth subrequests and the users'
  # ExternalName Services.
  enabled: false

service:
  portNumber: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # argus caps a CPU limit at 10 times the request.
    cpu: 500m
    memory: 128Mi

# Sessions are kept server side, in the Redis below. Its password is in the Secret
# oauth2-proxy-redis (key redis-password), made by install.sh.
sessionStorage:
  type: redis
  redis:
    existingSecret: oauth2-proxy-redis
    passwordKey: redis-password
    clientType: standalone
    standalone:
      connectionUrl: redis://oauth2-proxy-redis:6379

# One plain Redis from the official image, as extra objects of this release, rather than
# the chart's redis-ha subchart: that is a StatefulSet with Sentinel, three replicas and
# volumes by default, far more than a session cache needs. Nothing is persisted (argus
# has no block storage, and none is needed): a Redis restart loses the sessions and
# everyone logs in once more. It has a Service inside this namespace only and no Ingress,
# but argus users cannot make NetworkPolicies, so any pod in the cluster could reach that
# Service: hence the password.
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: oauth2-proxy-redis
      labels:
        app.kubernetes.io/name: oauth2-proxy-redis
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: oauth2-proxy-redis
        app.kubernetes.io/instance: "{{ .Release.Name }}"
      ports:
        - name: redis
          port: 6379
          targetPort: redis
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: oauth2-proxy-redis
      labels:
        app.kubernetes.io/name: oauth2-proxy-redis
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      replicas: 1
      revisionHistoryLimit: 2
      # Never two at once: each would hold different sessions behind the one Service.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: oauth2-proxy-redis
          app.kubernetes.io/instance: "{{ .Release.Name }}"
      template:
        metadata:
          labels:
            app.kubernetes.io/name: oauth2-proxy-redis
            app.kubernetes.io/instance: "{{ .Release.Name }}"
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: redis
              # The official image, pinned. Bump it deliberately.
              image: docker.io/library/redis:8.10.3-alpine
              command: ["redis-server"]
              # No snapshots and no append-only file. A memory cap below the limit,
              # evicting the least recently used sessions rather than running out.
              args:
                - --requirepass
                - $(REDIS_PASSWORD)
                - --save
                - ""
                - --appendonly
                - "no"
                - --maxmemory
                - 96mb
                - --maxmemory-policy
                - allkeys-lru
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: oauth2-proxy-redis
                      key: redis-password
              ports:
                - name: redis
                  containerPort: 6379
              readinessProbe:
                tcpSocket:
                  port: redis
                periodSeconds: 10
              livenessProbe:
                tcpSocket:
                  port: redis
                initialDelaySeconds: 10
                periodSeconds: 20
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  # argus caps a CPU limit at 10 times the request.
                  cpu: 500m
                  memory: 128Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            # Redis's working directory; nothing is saved in it.
            - name: data
              emptyDir:
                sizeLimit: 64Mi
