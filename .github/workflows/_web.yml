on:
  workflow_call:

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint and typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Size budget (the app shell, without the drawing viewer)
        run: npm run size

  # One server and data folder serve all of a run's specs, and they share it (search order,
  # page counts), so workers stay at 1. Instead each shard is its own runner, with its own server
  # and data folder: isolation for free. The `e2e` job below is the one stable check name.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps --only-shell chromium

      - name: Build
        run: npm run build

      - name: Smoke test against scrap serve
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/test-results

  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every e2e shard passed
        run: test "${{ needs.e2e-shard.result }}" = success
